plugins {
    id 'com.android.application'
}

android {
    namespace 'com.claudegame.flappy'
    compileSdk 34

    defaultConfig {
        applicationId 'com.claudegame.flappy'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    // One fixed signing key, committed to the repo, so APKs built locally and by GitHub
    // Actions have the same signature and each release installs over the previous one.
    // (A debug-style key generated for this project: fine for sideloading, not meant
    // for the Play Store.)
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the project key so the release APK is installable out of the box.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

android.testOptions.unitTests.includeAndroidResources = true

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}

// Optional: point Robolectric at a pre-downloaded android-all jar (offline CI / sandboxes).
tasks.withType(Test).configureEach {
    def dir = System.getenv('ROBOLECTRIC_DEPS_DIR')
    if (dir) {
        systemProperty 'robolectric.offline', 'true'
        systemProperty 'robolectric.dependency.dir', dir
    }
}
